name: DeathSwap
version: 1.0.0
main: com.deathswap.DeathSwapPlugin
api-version: "1.21"
description: Deathswap minigame with a creative wand.
commands:
  deathswap:
    description: Start or stop a deathswap game.
    usage: /deathswap start <wand seconds> | /deathswap stop
    permission: deathswap.use
permissions:
  deathswap.use:
    description: Allows using /deathswap.
    default: op
